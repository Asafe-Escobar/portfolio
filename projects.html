    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Starfield Background -->
    <div id="starfield"></div>
    <div id="nebula"></div>
    
    <!-- Navigation -->
    <nav class="navbar" id="navbar">
        <div class="nav-container">
            <div class="nav-logo">
                <span class="logo-text">JEANDERSON ESCOBAR</span>
                <span class="logo-subtitle">Software Engineer</span>
            </div>
            <ul class="nav-menu" id="nav-menu">

    <!-- Projects Section -->
    <section class="section page-content">
        <div class="container">
            <h1 class="page-title">Meus Projetos</h1>

                    <span id="status-text">🚀 Conectando com o GitHub...</span>
                </div>

            <div class="project-filters">

                <div id="language-filters"></div>
            </div>

            <div class="projects-grid" id="projects-grid">
                <!-- Projects will be loaded here -->

                <div class="spinner"></div>

            </div>
        </div>

    <script src="script.js"></script>
