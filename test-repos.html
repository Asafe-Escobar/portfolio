<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test - GitHub Repos</title>
    <style>
        body {
            font-family: 'Courier New', monospace;
            background: #0a0e27;
            color: #00ff88;
            padding: 20px;
            line-height: 1.6;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            color: #00d4ff;
            border-bottom: 2px solid #00d4ff;
            padding-bottom: 10px;
        }
        .repo-list {
            display: grid;
            gap: 15px;
            margin-top: 20px;
        }
        .repo-card {
            background: #1a1f3a;
            border: 1px solid #00d4ff;
            border-radius: 8px;
            padding: 15px;
        }
        .repo-card.featured {
            border: 3px solid #00ff88;
            background: #1f2d3a;
        }
        .repo-name {
            color: #00ff88;
            font-size: 20px;
            font-weight: bold;
        }
        .repo-desc {
            color: #aaa;
            margin: 10px 0;
        }
        .repo-meta {
            display: flex;
            gap: 15px;
            font-size: 14px;
            color: #888;
        }
        .featured-badge {
            background: #00ff88;
            color: #0a0e27;
            padding: 3px 8px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 12px;
        }
        #loading {
            text-align: center;
            font-size: 24px;
            padding: 50px;
        }
        .console-log {
            background: #000;
            color: #0f0;
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            font-size: 12px;
            overflow-x: auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 GitHub Repositories Test</h1>
        <div id="console"></div>
        <div id="loading">⏳ Carregando repositórios...</div>
        <div id="repos" class="repo-list"></div>
    </div>

    <script>
        const GITHUB_USERNAME = "Asafe-Escobar";
        const TOKEN = "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";
        const FEATURED_REPOS = [
            "simple-background-design",
            "contrato-masterclass",
            "projeto-sia",
            "carol-advogada",
            "apresentacao-",
            "Meca"
        ];

        function log(message) {
            const consoleDiv = document.getElementById('console');
            const logEntry = document.createElement('div');
            logEntry.className = 'console-log';
            logEntry.textContent = message;
            consoleDiv.appendChild(logEntry);
            console.log(message);
        }

        async function fetchRepos() {
            try {
                log(`🔍 Buscando repositórios de: ${GITHUB_USERNAME}`);
                log(`📌 Repositórios em destaque: ${FEATURED_REPOS.join(', ')}`);

                const headers = {
                    'Accept': 'application/vnd.github.v3+json',
                    'User-Agent': 'Portfolio-Test',
                    'Authorization': `token ${TOKEN}`
                };

                const response = await fetch(
                    `https://api.github.com/users/${GITHUB_USERNAME}/repos?sort=updated&per_page=100`,
                    { headers }
                );

                if (!response.ok) {
                    throw new Error(`API error: ${response.status}`);
                }

                const repos = await response.json();
                log(`📦 Total de repositórios encontrados: ${repos.length}`);

                // Separar em featured e outros
                const featured = [];
                const others = [];

                repos.forEach(repo => {
                    if (repo.fork) {
                        log(`⏭️ Pulando fork: ${repo.name}`);
                        return;
                    }
                    if (repo.archived) {
                        log(`⏭️ Pulando arquivado: ${repo.name}`);
                        return;
                    }

                    if (FEATURED_REPOS.includes(repo.name)) {
                        log(`⭐ REPO EM DESTAQUE ENCONTRADO: ${repo.name}`);
                        featured.push(repo);
                    } else {
                        others.push(repo);
                    }
                });

                log(`✅ ${featured.length} repositórios em destaque encontrados`);
                log(`📋 ${others.length} outros repositórios ativos`);

                // Ordenar outros por data
                others.sort((a, b) => new Date(b.updated_at) - new Date(a.updated_at));

                // Combinar: featured primeiro
                const allRepos = [...featured, ...others];

                displayRepos(allRepos.slice(0, 12));

            } catch (error) {
                log(`❌ ERRO: ${error.message}`);
                document.getElementById('loading').innerHTML = '❌ Erro ao carregar repositórios';
            }
        }

        function displayRepos(repos) {
            const loading = document.getElementById('loading');
            const reposDiv = document.getElementById('repos');

            loading.style.display = 'none';

            repos.forEach(repo => {
                const isFeatured = FEATURED_REPOS.includes(repo.name);
                const card = document.createElement('div');
                card.className = `repo-card ${isFeatured ? 'featured' : ''}`;
                
                card.innerHTML = `
                    ${isFeatured ? '<span class="featured-badge">⭐ EM DESTAQUE</span>' : ''}
                    <div class="repo-name">${repo.name}</div>
                    <div class="repo-desc">${repo.description || 'Sem descrição'}</div>
                    <div class="repo-meta">
                        <span>🌟 ${repo.stargazers_count} stars</span>
                        <span>🔀 ${repo.forks_count} forks</span>
                        <span>📝 ${repo.language || 'N/A'}</span>
                        <span>🔗 <a href="${repo.html_url}" target="_blank" style="color: #00d4ff;">GitHub</a></span>
                    </div>
                `;
                
                reposDiv.appendChild(card);
            });

            log(`✅ ${repos.length} repositórios exibidos na página`);
        }

        // Executar ao carregar
        fetchRepos();
    </script>
</body>
</html>
